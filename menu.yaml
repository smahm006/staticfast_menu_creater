# A top-level section is either a list of items, or a mapping of sub-sections
# to lists of items. Each top-level section starts on a new page, and so does
# each sub-section of the sections listed here. Other sub-sections flow on.
# Dishes name a drink and dessert group, matching the sub-sections below.
page_per_subsection: [main]
